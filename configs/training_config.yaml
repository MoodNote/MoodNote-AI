training:
    learning_rate: 2.0e-5 # standard base-size RoBERTa fine-tuning LR (dấu chấm bắt buộc: PyYAML parse 2e-5 thành str)
    batch_size: 16 # T4 16GB safe với PhoBERT-base-v2 ở max_seq_length 256
    gradient_accumulation_steps: 2 # effective batch = 16 * 2 = 32
    num_epochs: 12 # trần; early stopping cắt sớm
    warmup_ratio: 0.1
    weight_decay: 0.01 # standard cho BERT fine-tuning
    fp16: true # T4 không có bf16
    seed: 42 # seed chia split synthetic + seed run duy nhất của kịch bản không đa seed
    early_stopping_patience: 4 # tính theo epoch (eval + save mỗi epoch, cả 3 kịch bản)
    use_class_weights: true # 'balanced' trên train của từng kịch bản, nhân vào focal loss

optimizer:
    type: 'adamw_torch' # truyền thẳng vào TrainingArguments.optim
    betas: [0.9, 0.999]
    eps: 1.0e-8

scheduler:
    type: 'cosine'

logging:
    log_steps: 50
    save_total_limit: 1 # chỉ giữ checkpoint tốt nhất (+ checkpoint cuối nếu khác)

wandb:
    project: 'moodnote-ai'
    name: 'phobert-base-v2'
    enabled: true

# Thí nghiệm ablation 3 kịch bản (Nội dung 2 thuyết minh). Cả 3 kịch bản dùng chung
# đúng bộ hyperparameter phía trên — biến duy nhất là dữ liệu train/val.
ablation:
    scenarios: ['real_only', 'synthetic_only', 'combined']
    baseline: 'real_only' # "phương án nền" để so sánh
    metrics: ['accuracy', 'f1_macro', 'f1_weighted'] # đúng 3 chỉ số thuyết minh nêu
    seeds: [42, 43, 44] # đa seed để báo cáo mean ± std, tránh kết luận nằm trong nhiễu
    multi_seed_scenarios: ['real_only', 'combined'] # synthetic_only chỉ chạy 1 seed (control)
    real_dir: 'data/real/processed'
    synthetic_dir: 'data/synthetic/accepted'
    ablation_dir: 'data/ablation' # train/val mỗi kịch bản; val theo nguồn dữ liệu của kịch bản
    test_path: 'data/real/processed/test.csv' # cố định, read-only, dùng chung cho cả 3
    results_dir: 'reports/ablation'
    # Ngưỡng định hướng của thuyết minh, xét trên mean các seed. Chỉ báo cáo, không chặn gì.
    min_accuracy: 0.65
    min_f1_macro: 0.60
