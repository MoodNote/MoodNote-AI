seed: 42

# Cả 2 model chạy trên Colab T4 qua HF transformers, cả thử prompt (quy mô nhỏ) lẫn sinh
# hàng loạt. OpenRouter đã gỡ bản free Llama 8B (2026-09-21) nên bỏ khỏi thiết kế.
# Mỗi model sinh target_per_label / 2 mẫu mỗi nhãn; cross-LLM audit hoán đổi 2 model.
models:
    # Llama 3.1 thay Llama 3 gốc (2026-09-21): trích dẫn [9] của thuyết minh ("The Llama 3 Herd
    # of Models", arXiv 2407.21783) là bài công bố Llama 3.1; bản 3 gốc bỏ qua trục độ dài/văn
    # phong ở prompt trial v1-v2.
    llama:
        display_name: 'Llama-3.1-8B-Instruct'
        hf_model_id: 'meta-llama/Llama-3.1-8B-Instruct' # gated: accept license Llama 3.1 trên HF + HF_TOKEN
    qwen:
        display_name: 'Qwen3-8B'
        hf_model_id: 'Qwen/Qwen3-8B'

generation:
    target_total_samples: 2800
    target_per_label: 400 # 7 nhãn x 400 = 2800
    split_ratios:
        train: 0.70
        validation: 0.15
        test: 0.15
    load_in_4bit: true # 8B fp16 không vừa T4 16GB
    batch_size: 16
    # Sau prompt trial diary_v1 (2026-09-21): 0.9 / 0.95 / 1.15 làm Llama lẫn tiếng Anh/Trung.
    # HF repetition_penalty phạt cả token trong prompt, mà tiếng Việt lặp âm tiết dày ("tôi",
    # "không") nên bị đẩy sang token hiếm. Trial v2 với 1.0 thì Llama lặp vòng -> 1.05 (nhẹ).
    max_new_tokens: 400 # bản "dài" tới ~180 từ, 300 token sát ngưỡng cắt
    temperature: 0.8
    top_p: 0.9
    repetition_penalty: 1.05
    log_every_n_samples: 25

# 3 trục đa dạng hóa đúng như thuyết minh nêu (văn phong, độ dài, ngữ cảnh). Biến thể
# persona/tuổi tác nằm trong pool "van_phong"; biến thể chủ đề/tình huống nằm trong pool
# "ngu_canh" — không thêm trục mới ngoài văn bản đã nộp.
diversity_axes:
    van_phong:
        - 'tuổi teen, ngôn ngữ đời thường, nhiều từ viết tắt'
        - 'người lớn, điềm tĩnh, câu văn đầy đủ'
        - 'trang trọng, chỉn chu như viết thư'
        - 'thân mật, xưng hô suồng sã như nói chuyện với bạn thân'
        - 'hài hước, tự trào'
        - 'nghiêm túc, trầm tư'
    do_dai: # số từ ghi thêm từ diary_v2: Llama bỏ qua số câu ở trial v1
        - 'ngắn (2-3 câu, khoảng 30-60 từ)'
        - 'vừa (4-6 câu, khoảng 60-110 từ)'
        - 'dài (7-10 câu, khoảng 110-180 từ)'
    ngu_canh:
        - 'học tập, thi cử'
        - 'gia đình'
        - 'tình bạn'
        - 'công việc, thực tập'
        - 'sức khỏe'
        - 'mạng xã hội'
        # Từ diary_v3: 2 ngữ cảnh sẵn cảm xúc ("thất tình", "thành công nhỏ") kéo lệch nhãn khi
        # ghép với cảm xúc ngược chiều -> đổi sang trung tính.
        - 'chuyện tình cảm'
        - 'chuyện nhỏ trong ngày'
        - 'thời tiết, mùa trong năm'
        - 'tài chính, chi tiêu'

dedup:
    near_dup_threshold: 92.0 # rapidfuzz token_sort_ratio (0-100), trong nội bộ pool synthetic

leakage_guard:
    near_dup_threshold: 90.0 # so với text thật VSMEC (train+validation+test)
    compare_splits: ['train', 'validation', 'test']
    # Ngoài so toàn chuỗi, câu VSMEC dài >= N từ còn được dò "nằm trong" nhật ký (partial_ratio)
    # để bắt câu thật bị chèn nguyên văn; câu ngắn hơn quá chung chung nên chỉ so toàn chuỗi.
    partial_match_min_words: 8

prompt:
    instruction_template_id: 'diary_v3'
