manual_audit:
    sample_size: 180 # trong khoảng 150-200 thuyết minh nêu
    seed: 43
    raters: ["rater_a", "rater_b"]
    min_cohens_kappa: 0.60 # đỉnh mức "moderate" (Landis & Koch: 0.41-0.60) — ngưỡng go/no-go theo đợt

cross_llm_audit:
    audit_fraction: 0.175 # ~17.5%, trong khoảng 15-20% thuyết minh nêu
    seed: 44
    max_unnatural_rate: 0.10 # ngưỡng tỉ lệ mẫu bị gắn cờ "rập khuôn" trước khi đợt sinh bị gắn cờ
    # Cohen's Kappa giữa nhãn sinh và nhãn auditor. Thuyết minh không nêu ngưỡng cho cross-LLM.
    # Chốt 2026-09-22, trước bulk v5: thay "mismatch <= 15%" (~kappa 0.82, "almost perfect" —
    # chặt hơn hẳn chuẩn 0.60 cho người). 0.70 (giữa mức "substantial") cao hơn chuẩn người vì
    # văn bản được sinh để thể hiện rõ một cảm xúc, thấp hơn "almost perfect" vì auditor 8B có
    # lỗi riêng (v3: đoán Sadness 131 lần trên 70 mẫu Sadness).
    min_cohens_kappa: 0.70

acceptance:
    drop_cross_llm_flagged: true # lọc từng mẫu bị cross-LLM gắn cờ, độc lập với round verdict
    # Luật nhãn lớp 1 chốt 2026-09-23, TRƯỚC khi 2 rater chấm (sheet còn trống):
    # 2 rater đồng thuận khác nhãn sinh -> đè nhãn người; 2 rater lệch nhau -> bỏ.
    # Hiện thực vế "hiệu chỉnh dữ liệu" của thuyết minh. Không có knob: luật cố định.
